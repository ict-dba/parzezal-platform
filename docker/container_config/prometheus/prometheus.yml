#https://github.com/prometheus/prometheus/blob/release-3.13/config/testdata/conf.good.yml

# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  body_size_limit: 15MB
  sample_limit: 1500
  target_limit: 30
  label_limit: 30
  label_name_length_limit: 200
  label_value_length_limit: 200
  query_log_file: query.log
  scrape_failure_log_file: fail.log

  external_labels:
    monitor: pi_5
    owner: parzezal

# rule_files:
  # - "first.rules"
  # - "my/*.rules"

scrape_configs:
  - job_name: prometheus
    scrape_failure_log_file: fail_prom.log

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          machine: pi_5
          owner: parzezal
