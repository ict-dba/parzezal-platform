#https://github.com/prometheus/prometheus/blob/release-3.13/config/testdata/conf.good.yml

# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  body_size_limit: 15MB
  sample_limit: 1500
  target_limit: 30
  label_limit: 30
  label_name_length_limit: 200
  label_value_length_limit: 200
#  query_log_file: query.log
#  scrape_failure_log_file: fail.log

  external_labels:
    monitor: pi_5
    owner: parzezal

# rule_files:
  # - "first.rules"
  # - "my/*.rules"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          machine: prometheus_container
          owner: parzezal
  - job_name: grafana
    sample_limit: 6000
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          machine: grafana_container
          owner: parzezal
  - job_name: caddy
    scheme: https
    static_configs:
      - targets: ["metrics.parzezal.dev:443"]
        labels:
          machine: caddy_container
          owner: parzezal
